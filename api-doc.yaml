openapi: 3.0.0
info:
  title: MAY2026 Team 066 Healthcare API
  description: |
    API specification (OpenAPI 3.0) for the backend services
    Each operation includes an `x-user-stories` section mapping the API to product
    user stories, and documents expected error responses for robust validation.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server
tags:
  - name: auth
    description: Authentication endpoints (user/org login)
  - name: users
    description: User management
  - name: orgs
    description: Organization management
  - name: blood-requests
    description: Blood request lifecycle
  - name: blood-bank
    description: Blood bank operations
  - name: hospital
    description: Hospital endpoints
  - name: ngo
    description: NGO endpoints
  - name: camps
    description: Donation camp endpoints
  - name: notifications
    description: Notifications and alerts
  - name: admin
    description: Admin-level operations
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Short machine-friendly error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Optional additional error details
      required: [code, message]
    ValidationErrorDetail:
      type: object
      properties:
        loc:
          type: array
          items:
            type: string
        msg:
          type: string
        type:
          type: string
    ValidationError:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Validation failed for the request body
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
      required: [code, message]
    AuthRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
    Organization:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        approved:
          type: boolean
    BloodRequest:
      type: object
      properties:
        id:
          type: integer
        requester_id:
          type: integer
        blood_type:
          type: string
        quantity:
          type: integer
        status:
          type: string
paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: User login (email/password)
      description: |
        Authenticate a user with email and password and return a JWT access token.
        
        x-user-stories:
          - id: US-AUTH-001
            title: User Login
            description: As a user I want to authenticate with email/password so I can access protected endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad request (malformed JSON or missing fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/org/login:
    post:
      tags: [auth]
      summary: Organization login
      description: |
        Authenticate an organization account (org admins) and return a JWT.
        x-user-stories:
          - id: US-AUTH-002
            title: Org Login
            description: As an organization admin I want to sign in so I can manage organization resources.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Successful org login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users:
    get:
      tags: [users]
      summary: List users
      description: |
        Return a paginated list of users.
        x-user-stories:
          - id: US-USERS-001
            title: List Users
            description: As an admin I want to view users so I can manage access.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [users]
      summary: Create a new user
      description: |
        Create a new user account. Input is validated and returns `201` with created resource.
        x-user-stories:
          - id: US-USERS-002
            title: Create User
            description: As an admin I want to create users so they can access the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/InvalidInput'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{user_id}:
    parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: integer
    get:
      tags: [users]
      summary: Get user details
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [users]
      summary: Update user
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Updated
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [users]
      summary: Delete user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/blood-requests:
    get:
      tags: [blood-requests]
      summary: List blood requests
      description: |
        Return a list of blood requests. Supports optional query filters.
        x-user-stories:
          - id: US-BREQ-001
            title: Create Blood Request
            description: As a requester I want to submit a blood request so donors/hospitals can respond.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of blood requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BloodRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [blood-requests]
      summary: Create a new blood request
      description: |
        Create a blood request resource. Input is validated and returns `201` on success.
        x-user-stories:
          - id: US-BREQ-001
            title: Create Blood Request
            description: As a requester I want to submit a blood request so donors/hospitals can respond.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodRequest'
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/blood-requests/{request_id}:
    parameters:
      - in: path
        name: request_id
        required: true
        schema:
          type: integer
    get:
      tags: [blood-requests]
      summary: Get blood request details
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [blood-requests]
      summary: Update blood request
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodRequest'
      responses:
        '200':
          description: Updated
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [blood-requests]
      summary: Delete/cancel blood request
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/blood-bank:
    get:
      tags: [blood-bank]
      summary: Blood bank summary
      description: |
        Returns summary/metrics for a blood bank account.
        x-user-stories:
          - id: US-BB-001
            title: Blood Bank Dashboard
            description: As a blood bank operator I want to see current requests and inventory.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Summary
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/hospital:
    get:
      tags: [hospital]
      summary: Hospital list/summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List
  /api/v1/ngo:
    get:
      tags: [ngo]
      summary: NGO list/summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List
  /api/v1/camps:
    get:
      tags: [camps]
      summary: Donation camps
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List
  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: Notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List
  /api/v1/admin:
    get:
      tags: [admin]
      summary: Admin operations overview
      description: |
        Endpoints for administrative actions and metrics.
        x-user-stories:
          - id: US-ADMIN-001
            title: Admin Dashboard
            description: As an admin I want to view system-level metrics and manage resources.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  responses:
    InvalidInput:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated user does not have permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict (e.g. unique constraint)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
